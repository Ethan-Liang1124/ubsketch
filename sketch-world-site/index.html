<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2547d0">
<title>紙上世界</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div class="fab">
  <button id="locate" aria-label="定位到我">📍</button>
  <button id="addLm" aria-label="新增地標">＋</button>
</div>
<div class="sheet" id="sheet" hidden>
  <h2 id="shName"></h2><div class="sub" id="shInfo"></div>
  <div class="row"><button id="btnView" class="p">👁 看作品</button><button id="btnAdd">✏️ 新增作品</button></div>
  <button id="shClose" style="width:100%;margin-top:8px">關閉</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<dialog id="editor">
  <h3 style="margin:0 0 8px">剪下物件</h3>
  <canvas id="pv"></canvas>
  <label class="sub">線條靈敏度<input id="thr" type="range" min="70" max="95" value="86" style="width:100%"></label>
  <div id="list"></div>
  <div class="row"><button id="edCancel">取消</button><button id="edOk" class="p">進入 AR 擺放</button></div>
</dialog>

<div id="ar" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <div id="layer"></div><div class="cross"></div>
  <div class="hud top"><button id="arExit">‹ 離開</button><b id="arName" style="flex:1"></b><span id="arFilter"><button data-f="all" class="on">全部</button> <button data-f="day">早上</button> <button data-f="night">晚上</button></span></div>
  <div id="align"><b>先對準地標</b><div class="sub" style="color:#ccd">把鏡頭對準這個地標的正面，按一下對準。之後所有人都以這個方向為基準。</div><button id="btnAlign" class="p">對準了</button></div>
  <div class="hud bot" id="placeBar" hidden><div class="chips" id="chips"></div><button id="bPlace" class="p">放這裡</button><button id="bSm">縮小</button><button id="bBg">放大</button><button id="bPub" class="p">發佈</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
